<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <meta name="author" content="JulianDev06">
        <title>Registro</title>
        <link rel="shortcut icon" href="../img/icon.ico">  
        <link rel="stylesheet" href="../styles_login.css">
    </head>
    <body>
        <div class="wrapper">
            <form id="form-registro">
                <h1><img class="logo" src="../img/icon.png" alt="Bridge Logo">Bridge</h1>
                <h2>Registrar cuenta</h2>

                <div class="input-box">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <div class="input-box">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="input-box">
                    <label for="confirm-password">Confirmar contraseña:</label>
                    <input type="password" id="confirm-password" name="confirm_password" required>
                </div>

                <div class="input-box role-box">
                    <label for="rol">Selecciona rol:</label>
                    <select id="rol" name="rol" required>
                        <option value="" disabled selected hidden></option>
                        <option value="usuario">Usuario</option>
                        <option value="administrador">Administrador</option>
                    </select>
                </div>

                <button type="submit" class="btn">Crear cuenta</button>

                <div class="register-link">
                    <p>¿Ya tienes cuenta? <a href="../login.html">Iniciar sesión</a></p>
                </div>
            </form>
        </div>

        <script src="../js/register.js"></script>
    </body>
</html>
